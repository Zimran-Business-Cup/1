# See deploy/README.md. Only Caddy publishes ports; postgres, runner and tts
# are on an internal network without internet access.
name: heforage

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # ":80" serves plain HTTP (local). A domain name turns on automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${APP_IMAGE:-heforage-app:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://heforage:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/heforage
      RUNNER_URL: http://runner:8080
      TTS_URL: http://tts:8880
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_started
    networks: [default, internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heforage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: heforage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heforage -d heforage"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Starts sandbox containers through the Docker socket (see runner/README.md).
  runner:
    build:
      context: ../runner
    image: ${RUNNER_IMAGE:-heforage-runner:local}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]

  tts:
    build:
      context: ../tts
    image: ${TTS_IMAGE:-heforage-tts:local}
    restart: unless-stopped
    networks: [internal]

networks:
  default: {}
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  pgdata:
